        css += '  white-space: nowrap;';
        css += '}';

        css += '.stats-bar-track {';
        css += '  flex: 1;';
        css += '  height: 28px;';
        css += '  background: #2d1f1a;';
        css += '  border-radius: 6px;';
        css += '  overflow: hidden;';
        css += '  position: relative;';
        css += '}';

        css += '.stats-bar-fill {';
        css += '  height: 100%;';
        css += '  background: linear-gradient(90deg, #c9a96e 0%, #e8c98a 100%);';
        css += '  border-radius: 6px;';
        css += '  transition: width 0.6s ease;';
        css += '  min-width: 2px;';
        css += '}';

        css += '.stats-bar-count {';
        css += '  min-width: 50px;';
        css += '  font-size: 14px;';
        css += '  color: #c9a96e;';
        css += '  font-weight: 600;';
        css += '}';

        css += '.stats-bar-percent {';
        css += '  min-width: 45px;';
        css += '  font-size: 13px;';
        css += '  color: #a89880;';
        css += '  text-align: right;';
        css += '}';

        css += '.stats-price-grid {';
        css += '  display: grid;';
        css += '  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));';
        css += '  gap: 16px;';
        css += '}';

        css += '.stats-price-item {';
        css += '  background: #2d1f1a;';
        css += '  border-radius: 8px;';
        css += '  padding: 20px;';
        css += '  text-align: center;';
        css += '  border: 1px solid #4a3628;';
        css += '  transition: border-color 0.2s;';
        css += '}';

        css += '.stats-price-item:hover {';
        css += '  border-color: #c9a96e;';
        css += '}';

        css += '.stats-price-range {';
        css += '  font-size: 13px;';
        css += '  color: #a89880;';
        css += '  margin-bottom: 10px;';
        css += '}';

        css += '.stats-price-count {';
        css += '  font-size: 32px;';
        css += '  font-weight: 700;';
        css += '  color: #c9a96e;';
        css += '}';

        css += '.stats-price-unit {';
        css += '  font-size: 14px;';
        css += '  color: #d4c5b5;';
        css += '  margin-top: 4px;';
        css += '}';

        css += '.stats-empty {';
        css += '  text-align: center;';
        css += '  padding: 80px 20px;';
        css += '  color: #a89880;';
        css += '}';

        css += '.stats-empty-icon {';
        css += '  font-size: 64px;';
        css += '  margin-bottom: 20px;';
        css += '  opacity: 0.5;';
        css += '}';

        css += '.stats-empty-text {';
        css += '  font-size: 18px;';
        css += '  margin-bottom: 8px;';
        css += '  color: #d4c5b5;';
        css += '}';

        css += '.stats-empty-hint {';
        css += '  font-size: 14px;';
        css += '}';

        style.textContent = css;
        document.head.appendChild(style);
    }

    // ========== 工具函数 ==========
    function formatPrice(price) {
        if (typeof price !== 'number' || isNaN(price)) {
            return '0';
        }
        return price.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function getTypeName(type) {
        var typeMap = {
            'red': '红葡萄酒',
            'white': '白葡萄酒',
            'rose': '桃红葡萄酒',
            'sparkling': '起泡酒',
            'dessert': '甜酒',
            'fortified': '加强酒',
            'other': '其他'
        };
        return typeMap[type] || type || '未分类';
    }

    // ========== 数据计算 ==========
    function calculateStats(wines) {
        var stats = {
            total: wines.length,
            totalValue: 0,
            tasted: 0,
            byType: {},
            byPrice: {
                '0-100': 0,
                '100-300': 0,
                '300-500': 0,
                '500-1000': 0,
                '1000-2000': 0,
                '2000+': 0
            }
        };

        for (var i = 0; i < wines.length; i++) {
            var wine = wines[i];

            // 计算总价值
            var price = parseFloat(wine.price) || 0;
            stats.totalValue += price;

            // 计算已品鉴数量
            if (wine.tasted || wine.isTasted || wine.status === 'tasted') {
                stats.tasted++;
            }

            // 按类型分组
            var type = wine.type || wine.category || 'other';
            if (!stats.byType[type]) {
                stats.byType[type] = 0;
            }
            stats.byType[type]++;

            // 按价格区间分组
            if (price < 100) {
                stats.byPrice['0-100']++;
            } else if (price < 300) {
                stats.byPrice['100-300']++;
            } else if (price < 500) {
                stats.byPrice['300-500']++;
            } else if (price < 1000) {
                stats.byPrice['500-1000']++;
            } else if (price < 2000) {
                stats.byPrice['1000-2000']++;
            } else {
                stats.byPrice['2000+']++;
            }
        }

        return stats;
    }

    // ========== 渲染函数 ==========
    function renderOverviewCards(stats) {
        var html = '';
        html += '<div class="stats-cards">';
        
        html += '<div class="stats-card">';
        html += '  <div class="stats-card-value">' + stats.total + '</div>';
        html += '  <div class="stats-card-label">酒品总数</div>';
        html += '</div>';

        html += '<div class="stats-card">';
        html += '  <div class="stats-card-value">¥' + formatPrice(stats.totalValue) + '</div>';
        html += '  <div class="stats-card-label">总价值</div>';
        html += '</div>';

        html += '<div class="stats-card">';
        html += '  <div class="stats-card-value">' + stats.tasted + '</div>';
        html += '  <div class="stats-card-label">已品鉴</div>';
        html += '</div>';

        html += '</div>';
        return html;
    }

    function renderTypeDistribution(stats) {
        var html = '';
        html += '<div class="stats-section">';
        html += '  <div class="stats-section-title">类型分布</div>';
        html += '  <div class="stats-bar-chart">';

        // 获取类型并按数量排序
        var typeEntries = [];
        for (var type in stats.byType) {
            if (stats.byType.hasOwnProperty(type)) {
                typeEntries.push({ type: type, count: stats.byType[type] });
            }
        }
        typeEntries.sort(function(a, b) {
            return b.count - a.count;
        });

        var maxCount = typeEntries.length > 0 ? typeEntries[0].count : 1;

        for (var i = 0; i < typeEntries.length; i++) {
            var entry = typeEntries[i];
            var percent = ((entry.count / stats.total) * 100).toFixed(1);
            var barWidth = ((entry.count / maxCount) * 100).toFixed(1);

            html += '<div class="stats-bar-item">';
            html += '  <div class="stats-bar-label">' + getTypeName(entry.type) + '</div>';
            html += '  <div class="stats-bar-track">';
            html += '    <div class="stats-bar-fill" style="width: ' + barWidth + '%"></div>';
            html += '  </div>';
            html += '  <div class="stats-bar-count">' + entry.count + '瓶</div>';
            html += '  <div class="stats-bar-percent">' + percent + '%</div>';
            html += '</div>';
        }

        html += '  </div>';
        html += '</div>';
        return html;
    }

    function renderPriceDistribution(stats) {
        var html = '';
        html += '<div class="stats-section">';
        html += '  <div class="stats-section-title">价格区间分布</div>';
        html += '  <div class="stats-price-grid">';

        var priceRanges = [
            { key: '0-100', label: '¥0 - ¥100', display: '入门级' },
            { key: '100-300', label: '¥100 - ¥300', display: '日常级' },
            { key: '300-500', label: '¥300 - ¥500', display: '进阶级' },
            { key: '500-1000', label: '¥500 - ¥1000', display: '精选级' },
            { key: '1000-2000', label: '¥1000 - ¥2000', display: '高端级' },
            { key: '2000+', label: '¥2000以上', display: '珍藏级' }
        ];

        for (var i = 0; i < priceRanges.length; i++) {
            var range = priceRanges[i];
            var count = stats.byPrice[range.key] || 0;

            html += '<div class="stats-price-item">';
            html += '  <div class="stats-price-range">' + range.display + '</div>';
            html += '  <div class="stats-price-count">' + count + '</div>';
            html += '  <div class="stats-price-unit">' + range.label + '</div>';
            html += '</div>';
        }

        html += '  </div>';
        html += '</div>';
        return html;
    }

    function renderEmptyState() {
        var html = '';
        html += '<div class="stats-empty">';
        html += '  <div class="stats-empty-icon">🍷</div>';
        html += '  <div class="stats-empty-text">暂无酒品数据</div>';
        html += '  <div class="stats-empty-hint">添加一些酒品后即可查看统计信息</div>';
        html += '</div>';
        return html;
    }

    // ========== 主渲染函数 ==========
    function render(container) {
        if (!container) {
            console.error('StatsPage: container is required');
            return;
        }

        // 注入样式
        injectStyles();

        // 获取数据
        var data = null;
        try {
            if (window.WineDB && typeof window.WineDB.getAll === 'function') {
                data = window.WineDB.getAll();
            }
        } catch (e) {
            console.error('StatsPage: Error fetching data', e);
        }

        var wines = [];
        if (data) {
            if (Array.isArray(data)) {
                wines = data;
            } else if (typeof data === 'object') {
                wines = Object.values(data);
            }
        }

        // 构建页面
        var html = '';
        html += '<div class="stats-page">';
        html += '  <div class="stats-page-title">数据统计</div>';

        if (wines.length === 0) {
            html += renderEmptyState();
        } else {
            var stats = calculateStats(wines);
            html += renderOverviewCards(stats);
            html += renderTypeDistribution(stats);
            html += renderPriceDistribution(stats);
        }

        html += '</div>';

        container.innerHTML = html;
    }

    // ========== 导出模块 ==========
    window.StatsPage = {
        render: render
    };

})();
</script>

<script>
(function() {
    'use strict';

    // 私有变量
    var currentTheme = localStorage.getItem('winecabinet-theme') || 'dark';
    var currentFontSize = localStorage.getItem('winecabinet-fontsize') || 'standard';

    // 应用主题
    function applyTheme(theme) {
        currentTheme = theme;
        localStorage.setItem('winecabinet-theme', theme);
        document.documentElement.setAttribute('data-theme', theme);
        if (window.ThemeManager && window.ThemeManager.setTheme) {
            window.ThemeManager.setTheme(theme);
        }
    }

    // 应用字体大小
    function applyFontSize(size) {
        currentFontSize = size;
        localStorage.setItem('winecabinet-fontsize', size);
        var fontSizeMap = {
            'standard': '16px',
            'large': '18px',
            'xlarge': '20px'
        };
        document.documentElement.style.fontSize = fontSizeMap[size] || '16px';
    }

    // 创建头部区域
    function createHeader() {
        var header = document.createElement('div');
        header.style.cssText = 'text-align: center; padding: 40px 20px 30px; border-bottom: 1px solid rgba(255,215,0,0.2);';

        var avatar = document.createElement('div');
        avatar.style.cssText = 'width: 80px; height: 80px; background: linear-gradient(135deg, #8B0000, #A52A2A); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 15px; box-shadow: 0 4px 15px rgba(139,0,0,0.3);';
        avatar.textContent = '🍷';

        var nickname = document.createElement('div');
        nickname.style.cssText = 'font-size: 22px; font-weight: 600; color: #F5F5DC; margin-bottom: 8px; letter-spacing: 1px;';
        nickname.textContent = '酒友';

        var level = document.createElement('div');
        level.style.cssText = 'font-size: 14px; color: #DAA520; background: rgba(218,165,32,0.1); display: inline-block; padding: 6px 20px; border-radius: 20px; border: 1px solid rgba(218,165,32,0.3);';
        
        // 计算品鉴等级
        var stats = {};
        try {
            stats = WineDB.getStats() || {};
        } catch(e) {}
        var tasteCount = stats.tasteCount || 0;
        var levelText = '初级品鉴师';
        if (tasteCount >= 100) levelText = '大师级品鉴师';
        else if (tasteCount >= 50) levelText = '高级品鉴师';
        else if (tasteCount >= 20) levelText = '中级品鉴师';
        else if (tasteCount >= 5) levelText = '初级品鉴师';
        
        level.textContent = '🏆 ' + levelText;

        header.appendChild(avatar);
        header.appendChild(nickname);
        header.appendChild(level);
        return header;
    }

    // 创建统计数据
    function createStats() {
        var statsContainer = document.createElement('div');
        statsContainer.style.cssText = 'display: flex; justify-content: space-around; padding: 30px 20px; margin: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(139,0,0,0.2);';

        var stats = {};
        try {
            stats = WineDB.getStats() || {};
        } catch(e) {}

        var items = [
            { label: '酒款数', value: stats.wineCount || 0, icon: '📦' },
            { label: '品鉴数', value: stats.tasteCount || 0, icon: '👃' },
            { label: '收藏数', value: stats.favoriteCount || 0, icon: '❤️' }
        ];

        items.forEach(function(item) {
            var itemEl = document.createElement('div');
            itemEl.style.cssText = 'text-align: center; flex: 1;';

            var icon = document.createElement('div');
            icon.style.cssText = 'font-size: 24px; margin-bottom: 8px;';
            icon.textContent = item.icon;

            var value = document.createElement('div');
            value.style.cssText = 'font-size: 24px; font-weight: 700; color: #F5F5DC; margin-bottom: 4px;';
            value.textContent = item.value;

            var label = document.createElement('div');
            label.style.cssText = 'font-size: 12px; color: #A89070; letter-spacing: 1px;';
            label.textContent = item.label;

            itemEl.appendChild(icon);
            itemEl.appendChild(value);
            itemEl.appendChild(label);
            statsContainer.appendChild(itemEl);
        });

        return statsContainer;
    }

    // 创建设置列表
    function createSettings() {
        var settingsContainer = document.createElement('div');
        settingsContainer.style.cssText = 'margin: 20px; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(139,0,0,0.2); overflow: hidden;';

        var title = document.createElement('div');
        title.style.cssText = 'padding: 15px 20px 10px; font-size: 14px; color: #DAA520; letter-spacing: 1px; font-weight: 600;';
        title.textContent = '⚙️ 设置';
        settingsContainer.appendChild(title);

        var settings = [
            {
                title: '🎨 主题切换',
                subtitle: '当前: ' + currentTheme,
                action: function() {
                    var themes = ['dark', 'brown', 'blue'];
                    var currentIndex = themes.indexOf(currentTheme);
                    var nextTheme = themes[(currentIndex + 1) % themes.length];
                    applyTheme(nextTheme);
                    // 更新显示
                    var subtitleEl = this.parentNode.querySelector('.setting-subtitle');
                    if (subtitleEl) subtitleEl.textContent = '当前: ' + nextTheme;
                }
            },
            {
                title: '🔤 字体大小',
                subtitle: '当前: ' + currentFontSize,
                action: function() {
                    var sizes = ['standard', 'large', 'xlarge'];
                    var sizeLabels = { standard: '标准', large: '大', xlarge: '特大' };
                    var currentIndex = sizes.indexOf(currentFontSize);
                    var nextSize = sizes[(currentIndex + 1) % sizes.length];
                    applyFontSize(nextSize);
                    var subtitleEl = this.parentNode.querySelector('.setting-subtitle');
                    if (subtitleEl) subtitleEl.textContent = '当前: ' + sizeLabels[nextSize];
                }
            },
            {
                title: '📤 数据导出',
                subtitle: '导出所有品鉴数据',
                action: function() {
                    try {
                        var data = WineDB.getAll();
                        var json = JSON.stringify(data, null, 2);
                        var blob = new Blob([json], { type: 'application/json' });
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        a.href = url;
                        a.download = 'winecabinet-data-' + new Date().toISOString().split('T')[0] + '.json';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showToast('数据导出成功！');
                    } catch(e) {
                        showToast('导出失败: ' + e.message);
                    }
                }
            },
            {
                title: '📥 数据导入',
                subtitle: '从JSON文件导入数据',
                action: function() {
                    var input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '.json';
                    input.onchange = function(e) {
                        var file = e.target.files[0];
                        if (!file) return;
                        
                        var reader = new FileReader();
                        reader.onload = function(event) {
                            try {
                                var data = JSON.parse(event.target.result);
                                if (WineDB.import) {
                                    WineDB.import(data);
                                    showToast('数据导入成功！');
                                    // 刷新统计
                                    var statsContainer = document.querySelector('.stats-container');
                                    if (statsContainer) {
                                        var newStats = createStats();
                                        statsContainer.parentNode.replaceChild(newStats, statsContainer);
                                    }
                                }
                            } catch(e) {
                                showToast('导入失败: 文件格式错误');
                            }
                        };
                        reader.readAsText(file);
                    };
                    input.click();
                }
            },
            {
                title: '🗑️ 清除数据',
                subtitle: '删除所有品鉴记录',
                action: function() {
                    if (confirm('确定要清除所有数据吗？此操作不可撤销！')) {
                        if (confirm('再次确认：真的要删除所有品鉴记录吗？')) {
                            try {
                                if (WineDB.clear) {
                                    WineDB.clear();
                                    showToast('数据已清除');
                                    // 刷新统计
                                    var statsContainer = document.querySelector('.stats-container');
                                    if (statsContainer) {
                                        var newStats = createStats();
                                        statsContainer.parentNode.replaceChild(newStats, statsContainer);
                                    }
                                }
                            } catch(e) {
                                showToast('清除失败: ' + e.message);
                            }
                        }
                    }
                }
            },
            {
                title: 'ℹ️ 关于',
                subtitle: '酒柜管理 PWA',
                action: function() {
                    alert('酒柜管理 PWA v2.0.0\n\n您的私人品鉴助手\n帮助您记录和管理品鉴体验\n\n© 2023 酒柜管理团队');
                }
            }
        ];

        settings.forEach(function(setting, index) {
            var cell = document.createElement('div');
            cell.style.cssText = 'padding: 18px 20px; border-bottom: 1px solid rgba(139,0,0,0.1); cursor: pointer; transition: background 0.2s;' +
                                (index === settings.length - 1 ? 'border-bottom: none;' : '');
            
            cell.innerHTML = 
                '<div style="display: flex; justify-content: space-between; align-items: center;">' +
                    '<div>' +
                        '<div class="setting-title" style="font-size: 16px; color: #F5F5DC; margin-bottom: 4px;">' + setting.title + '</div>' +
                        '<div class="setting-subtitle" style="font-size: 12px; color: #8B7355;">' + setting.subtitle + '</div>' +
                    '</div>' +
                    '<div style="color: #A89070; font-size: 18px;">›</div>' +
                '</div>';

            cell.onclick = setting.action;
            settingsContainer.appendChild(cell);
        });

        return settingsContainer;
    }

    // 创建底部
    function createFooter() {
        var footer = document.createElement('div');
        footer.style.cssText = 'text-align: center; padding: 30px 20px; color: #5A4A3A; font-size: 12px;';
        footer.innerHTML = 'v2.0.0 • 酒柜管理 PWA';
        return footer;
    }

    // 显示提示
    function showToast(message) {
        var toast = document.createElement('div');
        toast.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: #F5F5DC; padding: 15px 30px; border-radius: 8px; z-index: 1000; font-size: 14px;';
        toast.textContent = message;
        document.body.appendChild(toast);
        
        setTimeout(function() {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 2000);
    }

    // 主渲染函数
    function render(container) {
        if (!container) return;
        
        // 清空容器
        container.innerHTML = '';
        
        // 应用当前主题和字体
        applyTheme(currentTheme);
        applyFontSize(currentFontSize);
        
        // 创建页面结构
        var page = document.createElement('div');
        page.style.cssText = 'min-height: 100vh; background: linear-gradient(180deg, #1a0a00 0%, #2d1810 100%); color: #F5F5DC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;';
        
        // 组装页面
        var header = createHeader();
        var stats = createStats();
        stats.className = 'stats-container';
        var settings = createSettings();
        var footer = createFooter();
        
        page.appendChild(header);
        page.appendChild(stats);
        page.appendChild(settings);
        page.appendChild(footer);
        
        container.appendChild(page);
    }

    // 导出模块
    window.ProfilePage = {
        render: render
    };

    // 初始化主题
    if (currentTheme && document.documentElement.setAttribute) {
        document.documentElement.setAttribute('data-theme', currentTheme);
    }

    // 初始化字体大小
    applyFontSize(currentFontSize);
})();
</script>

<script>
(function() {
  'use strict';
  WineDB.init();
  window.showToast = function(msg, duration) {
    duration = duration || 2000;
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, duration);
  };
  function renderPage(name, param) {
    var container = document.getElementById('page-' + name);
    if (!container) return;
    container.innerHTML = '';
    var tabBar = document.getElementById('tab-bar');
    var header = document.getElementById('header');
    var tabPages = ['cellar','add','search','stats','profile'];
    tabBar.style.display = tabPages.indexOf(name) >= 0 ? '' : 'none';
    header.style.display = '';
    switch(name) {
      case 'cellar': if (window.CellarPage) CellarPage.render(container); break;
      case 'add': if (window.WineForm) WineForm.render('add', null, container); break;
      case 'edit': if (window.WineForm) WineForm.render('edit', param, container); break;
      case 'wine': if (window.WineDetail) WineDetail.render(param, container); break;
      case 'search': if (window.SearchPage) SearchPage.render(container); break;
      case 'stats': if (window.StatsPage) StatsPage.render(container); break;
      case 'profile': if (window.ProfilePage) ProfilePage.render(container); break;
    }
  }
  function handleRoute() {
    var hash = location.hash || '#/';
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
    var pageName, tabName, param;
    if (hash.indexOf('#/wine/') === 0) { pageName = 'wine'; param = hash.replace('#/wine/', ''); }
    else if (hash.indexOf('#/edit/') === 0) { pageName = 'edit'; param = hash.replace('#/edit/', ''); }
    else {
      var map = { '#/': 'cellar', '#/add': 'add', '#/search': 'search', '#/stats': 'stats', '#/profile': 'profile' };
      pageName = map[hash] || 'cellar';
      tabName = pageName;
    }
    var page = document.getElementById('page-' + pageName);
    if (page) page.classList.add('active');
    if (tabName) {
      var activeTab = document.querySelector('.tab[data-page="' + tabName + '"]');
      if (activeTab) activeTab.classList.add('active');
    }
    renderPage(pageName, param);
  }
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
})();
</script>

</body>
</html>
